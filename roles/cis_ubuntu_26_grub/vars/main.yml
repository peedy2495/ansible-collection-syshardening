---
_cis_ubuntu_26_grub_policy:
  name: CIS Ubuntu Linux 26.04 LTS Benchmark
  version: 1.0.0
  source: https://www.cisecurity.org/benchmark/ubuntu_linux

_cis_ubuntu_26_grub_standard_options:
  apparmor_boot_activation:
    enabled: true
    reference: CIS 1.3.1.2
    reason: Ensure AppArmor cannot be bypassed in the bootloader.
    impact: A configuration change causes one controlled reboot.
    parameters:
      apparmor:
        state: present
        value: "1"
      security:
        state: present
        value: apparmor
    verification:
      - name: apparmor=1
        pattern: '(^|\s)apparmor=1(\s|$)'
      - name: security=apparmor
        pattern: '(^|\s)security=apparmor(\s|$)'
