---
# Level 1 is the broadly applicable server baseline. Level 2 additionally
# disables kernel features whose operational impact requires explicit review.
cis_ubuntu_26_kernel_additional_profile: level_1_server

# Override only deviations from the complete policy catalog. The merge is
# recursive, so inventory needs to specify only enabled.
cis_ubuntu_26_kernel_additional_overrides: {}

cis_ubuntu_26_kernel_additional_module_config_file: >-
  /etc/modprobe.d/61-cis-ubuntu-26-kernel-modules.conf
cis_ubuntu_26_kernel_additional_limits_file: >-
  /etc/security/limits.d/61-cis-ubuntu-26-core-dumps.conf

# Set false only for controlled test environments. Production runs unload
# disabled modules immediately when the kernel permits it.
cis_ubuntu_26_kernel_additional_unload_modules: true
