---
- name: Discover scoped additional firewall rule sets
  ansible.builtin.set_fact:
    firewall_additional_rule_set_names: >-
      {{ query(
           'ansible.builtin.varnames',
           '^firewall_additional_rules_[A-Za-z0-9_]+$'
         ) | sort }}

- name: Validate scoped additional firewall rule sets
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', firewall_additional_rule_set_name)
        is sequence
      - lookup('ansible.builtin.vars', firewall_additional_rule_set_name)
        is not string
    fail_msg: >-
      {{ firewall_additional_rule_set_name }} must be a list of firewall rule
      mappings.
  loop: "{{ firewall_additional_rule_set_names }}"
  loop_control:
    loop_var: firewall_additional_rule_set_name
    label: "{{ firewall_additional_rule_set_name }}"

- name: Initialize combined firewall rule set
  ansible.builtin.set_fact:
    firewall_combined_rules: >-
      {{ firewall_rules + firewall_additional_rules }}

- name: Append scoped additional firewall rule sets
  ansible.builtin.set_fact:
    firewall_combined_rules: >-
      {{ firewall_combined_rules
         + lookup(
             'ansible.builtin.vars',
             firewall_additional_rule_set_name
           ) }}
  loop: "{{ firewall_additional_rule_set_names }}"
  loop_control:
    loop_var: firewall_additional_rule_set_name
    label: "{{ firewall_additional_rule_set_name }}"

- name: Initialize effective firewall rule set
  ansible.builtin.set_fact:
    firewall_effective_rules: []

- name: Build effective firewall rule set
  ansible.builtin.set_fact:
    firewall_effective_rules: >-
      {{ firewall_effective_rules
         + [{'direction': 'input'} | combine(firewall_rule)] }}
  loop: "{{ firewall_combined_rules }}"
  loop_control:
    loop_var: firewall_rule
    label: "{{ firewall_rule.name | default('unnamed rule') }}"

- name: Validate firewall role input
  ansible.builtin.import_tasks: validate.yml

- name: Detect firewall implementation from the operating system
  ansible.builtin.set_fact:
    firewall_detected_backend: >-
      {{ firewall_backend_by_os_family[ansible_facts['os_family']] }}

- name: Apply detected firewall implementation
  ansible.builtin.include_tasks: "{{ firewall_detected_backend }}.yml"
