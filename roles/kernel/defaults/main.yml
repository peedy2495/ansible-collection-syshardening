---
# Persistent sysctl values keyed by their kernel parameter name. Empty defaults
# intentionally make the implementation role a no-op.
kernel_sysctl_settings: {}

# Expected build-time options from /boot/config-{{ ansible_kernel }}.
kernel_config_requirements: {}

# Named regular expressions which must not occur in /proc/cmdline.
kernel_forbidden_boot_parameters: []

kernel_sysctl_file: /etc/sysctl.d/60-ansible-kernel.conf
kernel_apply_runtime: true
kernel_config_file: "/boot/config-{{ ansible_kernel }}"
