---
# Directory containing the system-wide OpenSSH client configuration fragments.
ssh_client_config_dir: /etc/ssh/ssh_config.d

# Vendor-owned OpenSSH client configuration inspected for the fragment include.
ssh_client_config_vendor_file: /etc/ssh/ssh_config

# Fail unless the vendor configuration includes the configured fragment glob.
ssh_client_config_require_include: true

# Filename suffix used for managed and vendor-included fragments.
ssh_client_config_fragment_suffix: .conf

# Private ownership ledger stored inside the fragment directory.
ssh_client_config_manifest_file: .ansible-ssh-client-config.manifest

# Remove previously managed fragments that are now absent or disabled.
ssh_client_config_manage_removed_fragments: true

# Validate each candidate fragment with the installed OpenSSH client.
ssh_client_config_validate: true

# Non-resolving hostname passed to ssh when evaluating candidate configuration.
ssh_client_config_validation_host: ansible-validation.invalid

# OpenSSH client command or absolute path used for validation.
ssh_client_config_binary: ssh

# Report a detected RHEL-compatible system-wide cryptographic policy.
ssh_client_config_warn_crypto_policy: true

# Define how list values are serialized for individual OpenSSH directives.
ssh_client_config_list_modes:
  CanonicalDomains: space
  Ciphers: comma
  HostKeyAlgorithms: comma
  KexAlgorithms: comma
  MACs: comma
  PreferredAuthentications: comma
  PubkeyAcceptedAlgorithms: comma

# Policy-neutral by design. Policy and orchestration roles supply fragments.
ssh_client_config_fragments: {}
