---
- name: Validate the Ubuntu 26 kernel hardening target
  ansible.builtin.assert:
    that:
      - ansible_facts.get('distribution', '') == 'Ubuntu'
      - ansible_facts.get('distribution_major_version', '') == '26'
    fail_msg: >-
      The ubuntu_26_kernel_hardening orchestration applies only to Ubuntu
      26.x; detected {{ ansible_facts.get('distribution', 'unknown') }}
      {{ ansible_facts.get('distribution_version', 'unknown') }}.

- name: Apply the BSI Ubuntu 26 kernel policy
  ansible.builtin.include_role:
    name: peedy2495.syshardening.bsi_ubuntu_26_kernel

- name: Apply the complementary CIS Ubuntu 26 kernel network policy
  ansible.builtin.include_role:
    name: peedy2495.syshardening.cis_ubuntu_26_kernel_network

- name: Apply the additional CIS Ubuntu 26 kernel policy
  ansible.builtin.include_role:
    name: peedy2495.syshardening.cis_ubuntu_26_kernel_additional
