---
- name: Check kernel implementation no-op behavior
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_facts:
      system: Linux
      kernel: test
  roles:
    - role: peedy2495.syshardening.kernel

- name: Check BSI Ubuntu 26 kernel policy projection
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_facts:
      system: Linux
      distribution: Ubuntu
      distribution_major_version: "26"
      distribution_version: "26.04"
      kernel: test
    kernel_config_file: "{{ playbook_dir }}/fixtures/kernel.config"
    kernel_sysctl_file: /tmp/ansible-syshardening-kernel-check.conf
    kernel_apply_runtime: false
    bsi_ubuntu_26_kernel_overrides:
      sysrq:
        value: 176
  roles:
    - role: peedy2495.syshardening.bsi_ubuntu_26_kernel
  post_tasks:
    - name: Verify recursive policy override behavior
      ansible.builtin.assert:
        that:
          - _bsi_ubuntu_26_kernel_effective_options.sysrq.value == 176
          - _bsi_ubuntu_26_kernel_effective_options.aslr.enabled
          - _bsi_ubuntu_26_kernel_sysctls['kernel.sysrq'].value == 176
          - >-
            _bsi_ubuntu_26_kernel_sysctls[
              'kernel.randomize_va_space'
            ].value == 2

- name: Check CIS Ubuntu 26 kernel network policy projection
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_facts:
      system: Linux
      distribution: Ubuntu
      distribution_major_version: "26"
      distribution_version: "26.04"
      kernel: test
    kernel_apply_runtime: false
    cis_ubuntu_26_kernel_network_sysctl_file: >-
      /tmp/ansible-syshardening-cis-kernel-network-check.conf
    cis_ubuntu_26_kernel_network_overrides:
      ipv4_forwarding:
        value: 1
      ipv4_reverse_path_filter_all:
        enabled: false
  roles:
    - role: peedy2495.syshardening.cis_ubuntu_26_kernel_network
  post_tasks:
    - name: Verify CIS policy override and cleanup projection
      ansible.builtin.assert:
        that:
          - >-
            _cis_ubuntu_26_kernel_network_effective_options[
              'ipv4_forwarding'
            ].value == 1
          - >-
            _cis_ubuntu_26_kernel_network_sysctls[
              'net.ipv4.ip_forward'
            ].value == 1
          - >-
            _cis_ubuntu_26_kernel_network_sysctls[
              'net.ipv4.conf.all.rp_filter'
            ].state == 'absent'

- name: Check additional CIS Ubuntu 26 kernel policy projection
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_facts:
      system: Linux
      distribution: Ubuntu
      distribution_major_version: "26"
      distribution_version: "26.04"
      kernel: test
    cis_ubuntu_26_kernel_module_profile: level_2_server
    cis_ubuntu_26_kernel_module_config_file: >-
      /tmp/ansible-syshardening-kernel-additional/modules.conf
    cis_ubuntu_26_core_dump_limits_file: >-
      /tmp/ansible-syshardening-kernel-additional/core-limits.conf
    cis_ubuntu_26_kernel_module_unload_disabled: false
    cis_ubuntu_26_grub_overrides:
      apparmor_boot_activation:
        enabled: false
    cis_ubuntu_26_apparmor_profile: level_2_server
    cis_ubuntu_26_apparmor_overrides:
      packages:
        enabled: false
      runtime_activation:
        enabled: false
      profiles_enabled:
        enabled: false
      profiles_enforcing:
        enabled: false
    cis_ubuntu_26_kernel_module_overrides:
      overlay_filesystem_module:
        enabled: false
  roles:
    - role: peedy2495.syshardening.cis_ubuntu_26_kernel_additional
  post_tasks:
    - name: Verify additional CIS policy profile and overrides
      ansible.builtin.assert:
        that:
          - >-
            _cis_ubuntu_26_kernel_module_settings.cramfs.state
            == 'disabled'
          - >-
            _cis_ubuntu_26_kernel_module_settings.overlay.state
            == 'available'
          - >-
            _cis_ubuntu_26_kernel_module_settings.sctp.state
            == 'disabled'
          - >-
            _cis_ubuntu_26_grub_required_boot_parameters
            | length == 0
          - >-
            _cis_ubuntu_26_grub_parameters
            | length == 0
          - >-
            _cis_ubuntu_26_apparmor_packages
            | length == 0
          - >-
            _cis_ubuntu_26_core_dump_limits
            | length == 1
